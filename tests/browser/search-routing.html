<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:#111214;color:#ededed}
*{box-sizing:border-box}body{margin:0;padding:32px 20px;min-height:100vh}main{max-width:700px;margin:auto}h1{font-size:22px;margin:0 0 8px;font-weight:600}.fixture-note{font-size:13px;line-height:1.5;color:#bbb;margin:0 0 24px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #91baff;outline-offset:3px}button:not(:disabled):hover{filter:brightness(1.15)}select option{background:#202124;color:#eee}::selection{background:#355787;color:white}body[data-theme=light]{color-scheme:light;background:#fafafa;color:#242424}body[data-theme=light] .fixture-note{color:#565656}body[data-theme=light] select option{background:white;color:#222}@media(max-width:480px){body{padding:20px 12px}h1{font-size:20px}}

<body><main><h1>Search settings</h1><p class="fixture-note">Isolated built component · synthetic providers only. No production services, credentials or searches.</p><div id="app"></div></main>
<script src="/react.js"></script><script src="/react-dom.js"></script>
<script>window.__ModuleLoader__={load:function(entry){window.CopilotUI=entry.factory(function(id){if(id==='react')return window.React;throw new Error('Unexpected client dependency: '+id)})}};</script>
<script src="/client.js"></script>
<script>
const q=new URLSearchParams(location.search);document.body.dataset.theme=q.get('theme')||'dark';
const ROUTING='github-copilot-search-routing',COPILOT='github-copilot';
const state={routingRevision:4,copilotRevision:7,configuration:{searchProvider:'auto',defaultSearchProvider:'deepseek-official'},model:'fixture-responses-model',providers:['deepseek-official','github-copilot-hosted','exa','community-search-provider-with-a-long-identifier'],calls:[]};
const ns=(id,revision,value)=>({ns:id,revision,value,schema:{},applies:'live',secrets:[]});
const settings={describe:async()=>({ok:true,value:{writable:true,hasDocument:true,namespaces:[ns(ROUTING,state.routingRevision,{...state.configuration}),ns(COPILOT,state.copilotRevision,{searchModel:state.model})]}}),mutate:async(id,operations,revision)=>{
state.calls.push({id,operations,revision});const key=id===ROUTING?'routingRevision':'copilotRevision';if(revision!==state[key])return{ok:false,error:{code:'CONFLICT'}};
for(const operation of operations){if(id===ROUTING)state.configuration[operation.path[0]]=operation.value;else state.model=operation.value;}state[key]++;return{ok:true,value:ns(id,state[key],id===ROUTING?{...state.configuration}:{searchModel:state.model})};
}};
const routing={providers:async()=>({ok:true,value:{supported:true,providers:state.providers.map(id=>({id}))}})};
const copilot={status:async()=>({ok:true,value:{phase:'signed-in',configured:true,writable:true,inFlight:false,notices:[],accountModels:{state:'ready',models:[{id:'fixture-responses-model',name:'Fixture model',api:'openai-responses'}],rejected:[]}}})};
window.fixture=state;
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(window.CopilotUI.WebSearchRoutingCard,{settings,routing,copilot}));
</script></body></html>
