name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dd6322d604e00eec1ba5e0c8541159906a21094a
          path: dsh-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:upstream -- dsh-upstream
      - run: pnpm verify
      - run: mkdir artifacts
      - run: pnpm pack --pack-destination artifacts
      - name: Verify deployment metadata is packed
        if: runner.os == 'Linux'
        run: |
          tarball="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tf "$tarball" | grep -Fx 'package/deployment-baseline.json'
