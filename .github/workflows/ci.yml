name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        dsh:
          - release: 0.1.1-rc.2
            repository: cloga/deepseek-harness
            commit: a772dbbde82780bff2b9394427e9f0a24cafa1d5
          - release: 0.1.2-rc.1
            repository: deepseek-ai/deepseek-harness
            commit: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          - release: 0.1.3-alpha.1
            repository: deepseek-ai/deepseek-harness
            commit: d347e703908d0406b7a7ef80e3a0e594d86b2215
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.dsh.repository }}
          ref: ${{ matrix.dsh.commit }}
          path: dsh-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install Core pi-ai closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-llm-pi-ai...'
      - name: Install optional Chat verification closure
        if: matrix.dsh.release != '0.1.1-rc.2'
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-client-ui-chat...'
      - run: pnpm verify:upstream -- dsh-upstream
      - name: Verify reasoning presentation with real Core services
        if: matrix.dsh.release != '0.1.1-rc.2'
        run: pnpm verify:reasoning-ui -- dsh-upstream
      - name: Verify real Core config integration
        run: pnpm verify:controlled-core -- dsh-upstream
      - name: Prepare unchanged alpha tagged-source runtime verification
        if: matrix.dsh.release == '0.1.3-alpha.1'
        shell: bash
        run: |
          node scripts/verify-tagged-core.mjs prepare --root . --core dsh-upstream --target "$RUNNER_TEMP/copilot-tagged-core" --release "${{ matrix.dsh.release }}"
      - name: Exercise actual alpha runtime without building or patching Core
        if: matrix.dsh.release == '0.1.3-alpha.1'
        shell: bash
        run: |
          node node_modules/vitest/vitest.mjs run --config "$RUNNER_TEMP/copilot-tagged-core/vitest.config.mts"
      - run: pnpm verify
      - run: mkdir artifacts
      - run: pnpm pack --pack-destination artifacts
      - name: Verify packed archive
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm verify:tarball -- "artifacts/dsh-github-copilot-$version.tgz"

  published-adapter:
    name: Published adapter (${{ matrix.release }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # alpha.1 has a source release but no standalone npm artifacts.
        # Its actual runtime is exercised in the unchanged tagged-source job above.
        release: [0.1.2-rc.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare an isolated plugin fixture for published Core APIs
        shell: bash
        run: |
          node scripts/verify-published-core.mjs prepare --root . --target "$RUNNER_TEMP/copilot-published-core" --release "${{ matrix.release }}"
      - name: Install unchanged public dependency artifacts
        shell: bash
        run: |
          cd "$RUNNER_TEMP/copilot-published-core"
          pnpm install --ignore-scripts --strict-peer-dependencies --registry=https://registry.npmjs.org
      - name: Verify actual dependency paths and class identities
        shell: bash
        run: |
          node scripts/verify-published-core.mjs inspect --root "$RUNNER_TEMP/copilot-published-core" --release "${{ matrix.release }}"
      - name: Typecheck and exercise the published native adapter
        shell: bash
        env:
          DSH_PUBLISHED_CORE_RELEASE: ${{ matrix.release }}
        run: |
          cd "$RUNNER_TEMP/copilot-published-core"
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.tests.json
          node node_modules/vitest/vitest.mjs run tests/preview-provider.spec.ts tests/pi-provider-bridge.spec.ts tests/preview-route.spec.ts tests/account-model-auth.spec.ts tests/published-core.spec.ts tests/single-route.spec.ts
