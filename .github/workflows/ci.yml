name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        dsh:
          - release: 0.1.1-rc.2
            repository: cloga/deepseek-harness
            commit: a772dbbde82780bff2b9394427e9f0a24cafa1d5
            controlledCore: true
          - release: 0.1.2-alpha.5
            repository: deepseek-ai/deepseek-harness
            commit: db6bdc3576c2d4e7c965e8e3ed0c2a731eed87f5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.dsh.repository }}
          ref: ${{ matrix.dsh.commit }}
          path: dsh-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install controlled Core pi-ai closure
        if: matrix.dsh.controlledCore == true
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-llm-pi-ai...'
      - run: pnpm verify:upstream -- dsh-upstream
      - name: Verify real controlled Core config integration
        if: matrix.dsh.controlledCore == true
        run: pnpm verify:controlled-core -- dsh-upstream
      - run: pnpm verify
      - run: mkdir artifacts
      - run: pnpm pack --pack-destination artifacts
      - name: Verify deployment metadata is packed
        if: runner.os == 'Linux'
        run: |
          tarball="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          tar -tf "$tarball" | grep -Fx 'package/deployment-baseline.json'
