name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - cloga-assess-dsh-core-upgrade

permissions:
  contents: read

jobs:
  verify:
    # Isolated official-source fixtures do not inherit this project's workspace config.
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            release: 0.2.2-rc.3
            commit: 38a6a5c965aa99ab525161efb7cc5cf1fe62fced
          - os: windows-latest
            release: 0.2.2-rc.3
            commit: 38a6a5c965aa99ab525161efb7cc5cf1fe62fced
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.commit }}
          path: dsh-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact-Core release selection and original-byte publication policy
        run: node --test tests/scripts/release-policy.test.mjs tests/scripts/npm-distribution.test.mjs tests/scripts/tarball.test.mjs
      - name: Verify the project and source-fixture age policy
        shell: bash
        run: |
          test "$(pnpm config get minimumReleaseAge)" = 0
          test "$(cd dsh-upstream && pnpm config get minimumReleaseAge)" = 0
      - run: pnpm install --frozen-lockfile
      - name: Verify deployment baseline before Core fixtures
        run: pnpm verify:baseline
      - name: Install Core pi-ai closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-llm-pi-ai...'
      - name: Install optional Chat verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-client-ui-chat...'
      - run: pnpm verify:upstream -- dsh-upstream
      - name: Verify reasoning presentation with real Core services
        run: pnpm verify:reasoning-ui -- dsh-upstream
      - name: Verify real Core config integration
        run: pnpm verify:controlled-core -- dsh-upstream
      - name: Install tagged Session and Remote verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-api-session-controller...'
      - name: Install compaction recovery verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-agent-loop...' --filter '@deepseek-ai/dsh-compaction-basic...'
      - name: Install native Auto reviewer verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-experimental-auto-review...'
      - name: Install background compaction jobs verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-jobs-local...' --filter '@deepseek-ai/dsh-commands...'
      - name: Install isolated preset compaction verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-agent-preset-registry...' --filter '@deepseek-ai/cordis-plugin-group...'
      - name: Install subagent descriptor verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-subagent...'
      - name: Install native subagent model invocation verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-agent-loop-testkit...' --filter '@deepseek-ai/dsh-tool-subagent...' --filter '@deepseek-ai/dsh-subagent-spawn-in-process...' --filter '@deepseek-ai/dsh-session-persistence-jsonl...'
      - name: Install image-offload verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-compaction-image-offload...'
      - name: Install tagged search verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-tool-web...' --filter '@deepseek-ai/dsh-web-search-deepseek...'
      - name: Install native and PTC tool executor verification closures
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-tool-executor-native...' --filter '@deepseek-ai/dsh-tool-executor-ptc...'
      - name: Install native account persistence verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-credentials-local...' --filter '@deepseek-ai/dsh-app-boot...' --filter '@deepseek-ai/dsh-config-editor...' --filter '@deepseek-ai/dsh-settings...' --filter '@deepseek-ai/dsh-authorization...'
      - name: Install native diagnostic storage verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-storage-domain...' --filter '@deepseek-ai/dsh-storage-json...'
      - name: Install the official pinned system addon outside both source trees
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/copilot-native-addon" --ignore-scripts --no-save --no-audit --fund=false --registry=https://registry.npmjs.org @deepseek-ai/node-addon-system@0.1.2
      - name: Prepare exact DSH 0.2.2-rc.3 tagged-source runtime verification
        shell: bash
        run: |
          node scripts/verify-tagged-core.mjs prepare --root . --core dsh-upstream --target "$RUNNER_TEMP/copilot-tagged-core" --release "${{ matrix.release }}" --native-addon "$RUNNER_TEMP/copilot-native-addon"
      - name: Build plugin Client for pinned Core selector regression
        run: pnpm build
      - name: Exercise actual DSH 0.2 runtime without building or patching Core
        shell: bash
        run: |
          node node_modules/vitest/vitest.mjs run --config "$RUNNER_TEMP/copilot-tagged-core/vitest.config.mts" --reporter=default --reporter=json --outputFile "$RUNNER_TEMP/copilot-tagged-reviewer-results.json"
          node -e "const r=require(process.argv[1]); const s=r.testResults.find(s=>s.name.endsWith('auto-review-copilot-core.fixture.ts')); if(!s||s.assertionResults.length!==28||s.assertionResults.some(t=>t.status!=='passed')) throw new Error('expected all 28 native reviewer tests, none skipped'); console.log('Verified 28 executed tagged-source reviewer tests')" "$RUNNER_TEMP/copilot-tagged-reviewer-results.json"
          node -e "const r=require(process.argv[1]); for (const name of ['subagent-copilot-core.fixture.ts','native-subagent-copilot-core.fixture.ts']) { const s=r.testResults.find(s=>s.name.endsWith('/'+name)||s.name.endsWith('\\\\'+name)); if(!s||s.assertionResults.length!==1||s.assertionResults.some(t=>t.status!=='passed')) throw new Error('expected '+name+' to execute without skips'); } console.log('Verified managed and native Copilot subagent invocation tests')" "$RUNNER_TEMP/copilot-tagged-reviewer-results.json"
      - run: pnpm verify
      - run: mkdir artifacts
      - run: pnpm pack --pack-destination artifacts
      - name: Verify packed archive
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm verify:tarball -- "artifacts/dsh-github-copilot-$version.tgz"

      - name: Install verified archive and load it through the pinned Core host
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm exec node scripts/verify-install-smoke.mjs --archive "artifacts/dsh-github-copilot-$version.tgz" --host-modules node_modules

  published-adapter:
    name: Published adapter (${{ matrix.os }})
    # The isolated npm fixture has no project workspace configuration.
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare an isolated plugin fixture for published Core APIs
        shell: bash
        run: |
          node scripts/verify-published-core.mjs prepare --root . --target "$RUNNER_TEMP/copilot-published-core" --release 0.2.2-rc.3 --candidate true
      - name: Install unchanged public dependency artifacts
        shell: bash
        run: |
          cd "$RUNNER_TEMP/copilot-published-core"
          test "$(pnpm config get minimumReleaseAge)" = 0
          pnpm install --ignore-scripts --strict-peer-dependencies --registry=https://registry.npmjs.org
      - name: Verify actual dependency paths and class identities
        shell: bash
        run: |
          node scripts/verify-published-core.mjs inspect --root "$RUNNER_TEMP/copilot-published-core" --release 0.2.2-rc.3 --candidate true
      - name: Typecheck and exercise the published native adapter
        shell: bash
        env:
          DSH_CORE_EVIDENCE: published-artifact-runtime
          DSH_PUBLISHED_CORE_RELEASE: 0.2.2-rc.3
        run: |
          cd "$RUNNER_TEMP/copilot-published-core"
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/typescript/bin/tsc -p tsconfig.tests.json
          node node_modules/typescript/bin/tsc -p tsconfig.candidate-tests.json
          node node_modules/typescript/bin/tsc -p tsconfig.json
          pnpm exec tsdown
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts
          node node_modules/vitest/vitest.mjs run tests/copilot-stream-liveness.spec.ts tests/copilot-stream-adapter.spec.ts tests/config.spec.ts tests/preview-provider.spec.ts tests/pi-provider-bridge.spec.ts tests/preview-route.spec.ts tests/account-model-auth.spec.ts tests/published-core.spec.ts tests/single-route.spec.ts tests/search-routing.spec.ts tests/routed-web.spec.ts tests/deepseek-search-fallback.spec.ts tests/context-usage.spec.ts tests/context-evidence.spec.ts tests/context-evidence-runtime.spec.ts tests/context-evidence-ui.spec.ts tests/background-compaction.spec.ts tests/manual-compaction-recovery.spec.ts tests/fixtures/auto-review-copilot-core.fixture.ts
          node node_modules/vitest/vitest.mjs run --config vitest.diagnostics-published.config.ts
          node node_modules/vitest/vitest.mjs run --config vitest.candidate-published.config.ts
          node node_modules/vitest/vitest.mjs run --config vitest.auto-review-published.config.ts --reporter=default --reporter=json --outputFile reviewer-results.json
          node -e "const r=require('./reviewer-results.json'); const s=r.testResults.find(s=>s.name.endsWith('auto-review-copilot-core.fixture.ts')); if(!s||s.assertionResults.length!==28||s.assertionResults.some(t=>t.status!=='passed')) throw new Error('expected all 28 native reviewer tests, none skipped'); console.log('Verified 28 executed published-artifact reviewer tests')"

  release-ready:
    name: release-ready
    needs: [verify, published-adapter]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all compatibility and package checks
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISHED_RESULT: ${{ needs.published-adapter.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$PUBLISHED_RESULT" = success
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull-request base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
      - name: Require release metadata for important pull-request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/release-policy.mjs --base "origin/${{ github.base_ref }}"

  release:
    needs: [release-ready]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-ready.result == 'success' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
