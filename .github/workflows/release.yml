name: Release

# Only the fully gated main CI caller may publish. A tag created with
# GITHUB_TOKEN does not start another workflow, so this workflow creates and
# publishes the exact release itself.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dsh-github-copilot-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cloga/dsh-github-copilot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: Determine exact version and refuse unreleased important changes
        run: node scripts/release-policy.mjs --plan

  release:
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d347e703908d0406b7a7ef80e3a0e594d86b2215
          path: dsh-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install alpha.1 Core pi-ai closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-llm-pi-ai...'
      - run: pnpm verify:upstream -- dsh-upstream
      - run: pnpm verify:controlled-core -- dsh-upstream
      - name: Verify plugin package
        run: pnpm verify
      - run: mkdir artifacts
      - run: pnpm pack --pack-destination artifacts
      - name: Verify packed archive
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm verify:tarball -- "artifacts/dsh-github-copilot-$version.tgz"
      - name: Write and verify SHA-256 manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum -- *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish exact annotated tag and immutable GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: node scripts/publish-release.mjs "${RELEASE_TAG#v}"
