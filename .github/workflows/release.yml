name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d347e703908d0406b7a7ef80e3a0e594d86b2215
          path: dsh-upstream
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          tag_type="$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME must be annotated, got $tag_type" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - name: Install alpha.1 Core pi-ai closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-llm-pi-ai...'
      - run: pnpm verify:upstream -- dsh-upstream
      - run: pnpm verify:controlled-core -- dsh-upstream
      - name: Verify plugin package
        run: pnpm verify
      - run: mkdir artifacts
      - run: pnpm pack --pack-destination artifacts
      - name: Verify packed archive
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm verify:tarball -- "artifacts/dsh-github-copilot-$version.tgz"
      - name: Write SHA-256 manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum -- *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          release_flags=()
          if [[ "$version" =~ -(alpha|beta|rc)\. ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS \
            --verify-tag \
            --title "dsh-github-copilot $version" \
            --generate-notes \
            "${release_flags[@]}"
