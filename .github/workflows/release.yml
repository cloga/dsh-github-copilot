name: Release

# Only the fully gated main CI caller may publish. A tag created with
# GITHUB_TOKEN does not start another workflow, so this workflow creates and
# publishes the exact release itself.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Serialize all repository releases. Two main runs may carry the same prepared
  # version, so SHA-scoped concurrency would still race on one tag and draft.
  group: dsh-github-copilot-release
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cloga/dsh-github-copilot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: Determine exact version and refuse unreleased important changes
        run: node scripts/release-policy.mjs --plan

  release:
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' }}
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ddefc45fbc7f8e46dd73185e68295696d1297887
          path: dsh-upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install 0.1.6 Core pi-ai closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-llm-pi-ai...'
      - run: pnpm verify:upstream -- dsh-upstream
      - run: pnpm verify:controlled-core -- dsh-upstream
      - name: Install tagged Session and Remote verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-api-session-controller...'
      - name: Install alpha2 subagent descriptor verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-subagent...'
      - name: Install 0.1.6 image-offload verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-compaction-image-offload...'
      - name: Install tagged search verification closure
        working-directory: dsh-upstream
        run: pnpm install --frozen-lockfile --filter '@deepseek-ai/dsh-tool-web...' --filter '@deepseek-ai/dsh-web-search-deepseek...'
      - name: Verify current unchanged tagged runtime before packing
        shell: bash
        run: |
          node scripts/verify-tagged-core.mjs prepare --root . --core dsh-upstream --target "$RUNNER_TEMP/copilot-tagged-release" --release 0.1.6-alpha.2
          node node_modules/vitest/vitest.mjs run --config "$RUNNER_TEMP/copilot-tagged-release/vitest.config.mts"
      - name: Verify plugin package
        run: pnpm verify
      - name: Recover original release archive or pack once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: node scripts/prepare-release-artifact.mjs
      - name: Verify packed archive
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm verify:tarball -- "artifacts/dsh-github-copilot-$version.tgz"
      - name: Write and verify SHA-256 manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum -- *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish exact annotated tag and immutable GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: node scripts/publish-release.mjs "${RELEASE_TAG#v}"
      - name: Install pinned OIDC-capable npm CLI
        run: npm install --global npm@11.5.1 --registry=https://registry.npmjs.org/ --ignore-scripts
      - name: Publish the same verified archive to npm and verify integrity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/publish-npm.mjs "$version"
