name: Resolve development lock
on:
  pull_request:
    paths:
      - .github/workflows/resolve-development-lock.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm update @deepseek-ai/cordis @deepseek-ai/schemastery --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v6
        with:
          name: resolved-development-lock
          path: pnpm-lock.yaml
          retention-days: 1
