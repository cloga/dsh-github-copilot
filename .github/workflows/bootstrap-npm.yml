name: Bootstrap npm package

# Refs #43. One-time bootstrap follow-up for v0.4.0-alpha.18. Remove this
# workflow and NPM_TOKEN after the first package publication and Trusted
# Publisher setup are complete.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable release version to bootstrap
        required: true
        default: 0.4.0-alpha.18
        type: choice
        options:
          - 0.4.0-alpha.18

permissions:
  contents: read

concurrency:
  group: dsh-github-copilot-npm-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download and verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
        run: node scripts/bootstrap-npm.mjs prepare
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm CLI without lifecycle scripts
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          npm install --global npm@11.5.1 --ignore-scripts --registry=https://registry.npmjs.org/
          test "$(npm --version)" = "11.5.1"
      - name: Bootstrap or reconcile the exact npm version
        env:
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
          NPM_CONFIG_FETCH_RETRIES: '0'
          NPM_CONFIG_LOGLEVEL: silent
          NPM_CONFIG_LOGS_MAX: '0'
        run: node scripts/bootstrap-npm.mjs publish
