name: Desktop candidate focused checks

on:
  push:
    branches:
      - cloga-install-compatible-plugin

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify project age policy
        shell: bash
        run: test "$(pnpm config get minimumReleaseAge)" = 0
      - name: Resolve exact unchanged official dependencies
        run: pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies --registry=https://registry.npmjs.org
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
  focused:
    needs: lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the lock generated for this candidate
        uses: actions/download-artifact@v4
        with:
          name: desktop-candidate-lock
          path: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - name: Exercise model and lifecycle regressions
        run: pnpm exec vitest run tests/compatibility.spec.ts tests/loader-composition.spec.ts tests/client.spec.ts tests/client-search-inject.spec.ts tests/preview-route.spec.ts tests/preview-provider.spec.ts tests/published-core.spec.ts tests/copilot-usage-host.spec.ts tests/copilot-usage-card.spec.ts tests/copilot-usage-normalize.spec.ts tests/copilot-usage-remote.spec.ts tests/copilot-usage-ui.spec.ts
  fixture-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/scripts/agent.test.mjs tests/scripts/published-core.test.mjs tests/scripts/tagged-core.test.mjs
