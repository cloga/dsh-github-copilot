name: Desktop candidate focused checks

on:
  push:
    branches:
      - cloga-install-compatible-plugin

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve exact unchanged official dependencies
        run: pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies --registry=https://registry.npmjs.org
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - name: Exercise model and lifecycle regressions
        run: pnpm exec vitest run tests/compatibility.spec.ts tests/loader-composition.spec.ts tests/client.spec.ts tests/client-search-inject.spec.ts tests/preview-route.spec.ts tests/published-core.spec.ts
  fixture-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/scripts/published-core.test.mjs tests/scripts/tagged-core.test.mjs
