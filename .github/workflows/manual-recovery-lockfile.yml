name: Temporary manual recovery lockfile resolution

on:
  push:
    branches:
      - cloga-oversized-manual-compaction-recovery

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: manual-recovery-lockfile
          path: pnpm-lock.yaml
