name: Rc3 exact dependency recovery

on:
  push:
    branches:
      - cloga-assess-dsh-core-upgrade

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read exact official package metadata
        run: |
          npm view @deepseek-ai/dsh-agent@0.2.1-rc.3 version dist.integrity --registry=https://registry.npmjs.org
          npm view @deepseek-ai/dsh-permission-presets@0.2.1-rc.3 version dist.integrity --registry=https://registry.npmjs.org
          npm view @deepseek-ai/dsh-agent time --json --registry=https://registry.npmjs.org
      - name: Resolve unchanged exact dependencies with the existing age policy
        run: pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies --registry=https://registry.npmjs.org
      - uses: actions/upload-artifact@v4
        with:
          name: rc3-exact-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
